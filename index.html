<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arch dreams!!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>:root {
  --bg: #0a0a0b;
  --panel: #16181a;
  --line: #2c3033;
  --text: #c6ccd2;
  --dim: #767e86;
  --accent: #cc4517;
  --on-accent: #fff3ec;
}

html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: "Archivo", system-ui, sans-serif; }
#map { position: fixed; inset: 0; background: var(--bg); }

.title {
  position: fixed; z-index: 500; top: 16px; left: 16px; margin: 0;
  padding: 6px 12px 8px;
  background: var(--accent); color: var(--on-accent);
  font-size: 22px; font-weight: 800; font-stretch: 125%; letter-spacing: -0.01em; line-height: 1;
  pointer-events: none;
}

/* Pins: a filled square, like a site footprint on a plat map */
.pin { width: 14px; height: 14px; background: var(--accent); border: 2px solid var(--on-accent); box-sizing: border-box; transform: rotate(45deg); }
.pin:focus-visible { outline: 2px solid var(--on-accent); outline-offset: 3px; }

.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 2px; box-shadow: none; }
.leaflet-popup-content { margin: 14px 16px; font: 14px/1.45 "Archivo", system-ui, sans-serif; }
.leaflet-container a.leaflet-popup-close-button { color: var(--dim); }
.pop h2 { margin: 0 0 4px; font-size: 17px; font-weight: 700; font-stretch: 110%; color: var(--on-accent); }
.pop .addr { color: var(--dim); margin: 0 0 10px; }
.pop dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 10px; }
.pop dt { color: var(--dim); }
.pop dd { margin: 0; }
.pop a { color: var(--accent); }

.leaflet-control-attribution { background: rgba(10, 10, 11, 0.7) !important; color: var(--dim); }
.leaflet-control-attribution a { color: var(--dim); }
.leaflet-bar a { background: var(--panel); color: var(--text); border-color: var(--line); }
</style>
</head>
<body>
<div id="map"></div>
<h1 class="title">arch dreams!!!</h1>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>const SITES = [{"name": "Uptown Theatre", "address": "4816 N Broadway, Chicago, IL 60640", "sat": "10am-3pm", "sun": "10am-3pm", "url": "https://openhousechicago.org/sites/recVzrEJFpZCm04uH", "lat": 41.969505, "lng": -87.659713}, {"name": "Electrical Audio", "address": "2621 W. Belmont Ave., Chicago, IL 60618", "sat": "Closed", "sun": "10am-5pm", "url": "https://openhousechicago.org/sites/recE9khuvRUUvo9Ai", "lat": 41.939394, "lng": -87.693803}, {"name": "Working Bikes", "address": "2434 S. Western Ave., Chicago, IL 60608", "sat": "10am-5pm", "sun": "Closed", "url": "https://openhousechicago.org/sites/reczKCAkaxSOgcfeF", "lat": 41.847345, "lng": -87.685728}, {"name": "Mana Contemporary Chicago", "address": "2233 S. Throop St., Chicago, IL 60608", "sat": "12-5pm", "sun": "Closed", "url": "https://openhousechicago.org/sites/rectZP6wJLEb3gJpJ", "lat": 41.850535, "lng": -87.658262}, {"name": "The Plant", "address": "1400 W. 46th St., Chicago, IL 60609", "sat": "10am-4pm", "sun": "10am-4pm", "url": "https://openhousechicago.org/sites/rectOvZhOflGmdoTs", "lat": 41.810768, "lng": -87.660576}, {"name": "Zhou B Art Center", "address": "1029 W. 35th St., Chicago, IL 60616", "sat": "10am-5pm", "sun": "Closed", "url": "https://openhousechicago.org/sites/recyY3ItZBDMXZOOq", "lat": 41.830584, "lng": -87.652312}, {"name": "Smashed Plastic Record Pressing", "address": "4200 W. Diversey Ave., Chicago, IL 60639", "sat": "10am-3pm", "sun": "10am-3pm", "url": "https://openhousechicago.org/sites/recGNGNzLflAqzsPR", "lat": 41.931846, "lng": -87.73249}, {"name": "Pui Tak Center", "address": "2216 S. Wentworth Ave., Chicago, IL 60616", "sat": "10am-4pm", "sun": "Closed", "url": "https://openhousechicago.org/sites/reccKiqVCYutXnjfG", "lat": 41.852365, "lng": -87.632053}, {"name": "Kenar Studio", "address": "1007 N. Wolcott Ave., Chicago, IL 60622", "sat": "11am-5pm", "sun": "11am-5pm", "url": "https://openhousechicago.org/sites/rec2Z0x283WnciMvx", "lat": 41.899973, "lng": -87.674581}];</script>
<script>const map = L.map("map", { zoomControl: false });
L.control.zoom({ position: "bottomright" }).addTo(map);
const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas";
L.tileLayer(`${esri}/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`, {
  attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors",
  maxZoom: 16,
}).addTo(map);
L.tileLayer(`${esri}/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16 }).addTo(map);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const icon = L.divIcon({ className: "", html: '<div class="pin"></div>', iconSize: [14, 14] });

const markers = SITES.map((s) =>
  L.marker([s.lat, s.lng], { icon, title: s.name, keyboard: true })
    .bindPopup(
      `<div class="pop"><h2>${esc(s.name)}</h2>` +
      `<p class="addr">${esc(s.address)}</p>` +
      `<dl><dt>Sat</dt><dd>${esc(s.sat)}</dd><dt>Sun</dt><dd>${esc(s.sun)}</dd></dl>` +
      `<a href="${esc(s.url)}" target="_blank" rel="noopener">Open House page</a></div>`
    )
    .addTo(map)
);

map.fitBounds(L.featureGroup(markers).getBounds(), { padding: [48, 48] });
</script>
</body>
</html>
